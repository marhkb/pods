name: Create Release Draft

on:
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
            container: archlinux:base-devel
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            # the official archlinux image is x86_64 only
            container: ghcr.io/pkgforge-dev/archlinux:latest
    container: ${{ matrix.container }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4

      - name: Set up AppImage tools
        uses: pkgforge-dev/anylinux-setup-action@v6
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/get-debloated-pkgs.sh
          MAKE_AUR_PACKAGE: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/c9079a3c4a2af6ff86262dbbd794753aa0c38768/useful-tools/make-aur-package.sh

      - name: Install dependencies
        run: build-aux/appimage/get-dependencies.sh

      - name: Build AppImage
        run: build-aux/appimage/make-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage*

  release:
    name: Release
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install cargo-vendor-filterer
        run: cargo install cargo-vendor-filterer

      - name: Create vendored sources
        run: build-aux/dist-vendor.sh ../ src
        shell: bash

      - name: Archive repository
        run: git archive --format tar HEAD > pods-${{ github.ref_name }}.tar

      - name: Add vendored sources and cargo config to tarball
        run: tar -rf pods-${{ github.ref_name }}.tar .cargo vendor

      - name: Compress tarball
        run: xz -z pods-${{ github.ref_name }}.tar

      - name: Generate checksum
        run: sha256sum pods-${{ github.ref_name }}.tar.xz > pods-${{ github.ref_name }}.tar.xz.sha256sum

      - name: Extract release notes
        run: |
          echo 'RELEASE_NOTES<<EOF' >> $GITHUB_ENV
          xmllint --xpath '//release[1]/description' data/com.github.marhkb.Pods.metainfo.xml.in.in | xmllint --format - >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          body: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            pods-${{ github.ref_name }}.tar.xz
            pods-${{ github.ref_name }}.tar.xz.sha256sum
            dist/*
